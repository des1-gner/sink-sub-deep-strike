function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}

function flipC(src){const [c,x]=mkCanvas(src.width,src.height);x.translate(src.width,0);x.scale(-1,1);x.drawImage(src,0,0);return c;}
function tintC(src,col){const [c,x]=mkCanvas(src.width,src.height);x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return c;}
function outlineC(src,col='#1a1c2c'){const [c,x]=mkCanvas(src.width+2,src.height+2);const t=tintC(src,col);for(const [dx,dy] of [[0,1],[2,1],[1,0],[1,2]])x.drawImage(t,dx,dy);x.drawImage(src,1,1);return c;}
function bake(c){const l=flipC(c);return{r:c,l,wr:tintC(c,'#ffffff'),wl:tintC(l,'#ffffff'),w:c.width,h:c.height};}

function poly(c,pts,col){c.fillStyle=col;let y0=Infinity,y1=-Infinity;for(const p of pts){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const yc=y+0.5,xs=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}xs.sort((p,q)=>p-q);for(let i=0;i+1<xs.length;i+=2){const xa=Math.round(xs[i]),xb=Math.round(xs[i+1]);if(xb>xa)c.fillRect(xa,y,xb-xa,1);}}}
function capsule(c,x0,y0,w,h,cols,n=3){for(let j=0;j<h;j++){const v=((j+0.5)/h)*2-1;const k=Math.pow(1-Math.pow(Math.abs(v),n),1/n);const half=Math.round(k*w/2);c.fillStyle=v<-0.45?cols[2]:(v>0.4?cols[0]:cols[1]);c.fillRect(x0+Math.round(w/2)-half,y0+j,half*2,1);}}
function disc(x,y,r,col){ctx.fillStyle=col;x=Math.round(x);y=Math.round(y);r=Math.round(r);if(r<=0){ctx.fillRect(x,y,1,1);return;}for(let dy=-r;dy<=r;dy++){const dx=Math.round(Math.sqrt(r*r-dy*dy));ctx.fillRect(x-dx,y+dy,dx*2+1,1);}}
function ring(x,y,r,col,th=1){ctx.fillStyle=col;const n=Math.max(12,Math.floor(r*6.3));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;ctx.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r),th,th);}}
function line(x0,y0,x1,y1,col,th=1){ctx.fillStyle=col;const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)));for(let i=0;i<=n;i++)ctx.fillRect(Math.round(lerp(x0,x1,i/n)),Math.round(lerp(y0,y1,i/n)),th,th);}

let parts=[];
function P(x,y,vx,vy,life,col,sz=1,k='f'){if(parts.length>1800)return;parts.push({x,y,vx,vy,life,max:life,col,sz,k});}
function bubbles(x,y,n,sp=4){for(let i=0;i<n;i++)P(x+rand(-sp,sp),y+rand(-sp,sp),rand(-0.2,0.2),rand(-0.3,-0.9),rand(60,140),TH.foam,Math.random()<0.3?2:1,'b');}
function splash(x,n=14,pw=1){for(let i=0;i<n;i++)P(x+rand(-4,4),SEA-1,rand(-1,1)*pw,rand(-2.2,-0.6)*pw,rand(30,60),Math.random()<0.5?'#ffffff':TH.foam,Math.random()<0.3?2:1,'w');for(let i=0;i<6;i++)P(x+rand(-8,8),SEA,rand(-0.4,0.4),0,rand(20,40),'#ffffff',1,'foam');}
function updParts(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life--;switch(p.k){
 case 'b':p.x+=p.vx+Math.sin((p.life+p.y)*0.15)*0.15;p.y+=p.vy;if(p.y<SEA+2)p.life=0;break;
 case 'w':p.vy+=0.12;p.x+=p.vx;p.y+=p.vy;if(p.y>SEA+1&&p.vy>0)p.life=0;break;
 case 'd':p.x+=p.vx;p.y+=p.vy;if(p.y<SEA)p.vy+=0.15;else{p.vx*=0.96;p.vy=p.vy*0.95+0.04;}if(p.y>floorAt(p.x))p.life=Math.min(p.life,1);break;
 case 's':case 'i':p.x+=p.vx;p.y+=p.vy;p.vx*=0.97;p.vy*=0.97;break;
 case 'foam':p.x+=p.vx;p.y=waveAt(p.x);break;
 default:p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;if(p.y<SEA)p.vy+=0.05;}
 if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();}}}
function drawParts(){for(const p of parts){const f=p.life/p.max,x=Math.round(p.x),y=Math.round(p.y);
 switch(p.k){
  case 'b':ctx.globalAlpha=0.75;ctx.fillStyle=p.col;if(p.sz>1){ctx.fillRect(x,y-1,1,1);ctx.fillRect(x-1,y,1,1);ctx.fillRect(x+1,y,1,1);ctx.fillRect(x,y+1,1,1);}else ctx.fillRect(x,y,1,1);ctx.globalAlpha=1;break;
  case 's':{ctx.globalAlpha=f*0.6;ctx.fillStyle=p.col;const s=Math.round(p.sz*(2-f));ctx.fillRect(x-(s>>1),y-(s>>1),s,s);ctx.globalAlpha=1;break;}
  case 'i':{ctx.globalAlpha=Math.min(1,f*1.5)*0.85;ctx.fillStyle=p.col;const s=Math.round(p.sz*(1.6-f*0.6));ctx.fillRect(x-(s>>1),y-(s>>1),s,s);ctx.globalAlpha=1;break;}
  case 'f':ctx.fillStyle=f>0.7?'#fff4c4':f>0.45?'#ffcd75':f>0.25?'#ef7d57':'#b13e53';ctx.fillRect(x,y,p.sz,p.sz);break;
  default:ctx.fillStyle=p.col;ctx.fillRect(x,y,p.sz,p.sz);}}}

// ---------------- game state ----------------
let state='title',frame=0,shake=0,flashA=0,flashC='#fff',hitstop=0,G=null;
let hi=+(localStorage.getItem('sinksub_hi')||0);
let selShip=clamp(+(localStorage.getItem('sinksub_ship')||0)||0,0,3);
function flash(c,a){flashC=c;flashA=Math.max(flashA,a);}
const NEWS={2:'HUNTERS FIRE AIMED TORPEDOES',3:'MINELAYERS + JELLYFISH SIGHTED',4:'DRONE SWARMS INBOUND',6:'STEALTH SUBS: WATCH FOR THE SHIMMER',7:'IRONCLADS LAUNCH MISSILES',8:'ALL CONTACTS HOSTILE'};
function saveHi(){if(G&&G.score>hi){hi=G.score;localStorage.setItem('sinksub_hi',hi);G.newHi=true;}}

function newGame(){const S=SHIPS[selShip];
 G={S,p:{x:W/2,vx:0,hp:S.hp,inv:90,shield:0,face:1,sp:0,spT:0,cd:0,side:1,pow:{T:0,M:0,F:0,H:0},dead:false,sinkY:0},
  score:0,wave:0,en:[],bombs:[],sh:[],booms:[],pend:[],wrecks:[],picks:[],texts:[],rings:[],beams:[],boss:null,
  q:[],spawnT:0,ws:'intro',wt:0,combo:0,comboT:0,best:0,kills:0,drops:0,hitIds:new Set(),stun:0,reveal:0,esc:0,t:0,banner:null,barrage:0,barT:0,cycle:0,bossIdx:0,overT:0,newHi:false};
 parts=[];startWave(1);}
function banner(big,small,col='#ffcd75',dur=150,warn=false){G.banner={big,small,col,t:0,dur,warn};}
function buildWave(n){const pool=[['scout',3],['patrol',3]];
 if(n>=2)pool.push(['hunter',2]);if(n>=3)pool.push(['layer',1.5],['jelly',1]);if(n>=4)pool.push(['drone',1.2]);if(n>=6)pool.push(['stealth',1.5]);if(n>=7)pool.push(['iron',1]);
 const tot=pool.reduce((a,b)=>a+b[1],0),q=[];const count=5+Math.floor(n*1.6);
 for(let i=0;i<count;i++){let r=Math.random()*tot,t='scout';for(const [k,w] of pool){r-=w;if(r<=0){t=k;break;}}q.push(t);}
 if(NEWS[n]){const nt={2:'hunter',3:'layer',4:'drone',6:'stealth',7:'iron'}[n];if(nt)q.splice(1,0,nt);}
 return q;}
function startWave(n){G.wave=n;G.esc=0;setTheme(Math.floor((n-1)/5)%4);
 if(n%5===0){G.ws='bossIntro';G.wt=0;G.bossIdx=(n/5-1)%4;G.cycle=Math.floor((n/5-1)/4);banner('WARNING','LARGE CONTACT: '+BOSSES[G.bossIdx].n,'#ff3040',170,true);sfx.alarm();setMusic('boss');}
 else{G.ws='intro';G.wt=0;G.q=buildWave(n);G.spawnT=30;banner('WAVE '+n,NEWS[n]||choice(['SINK THEM ALL','HOLD THE LINE','DEPTH CHARGES READY','SONAR CONTACTS RISING']));setMusic('main');}}
function waveClear(){G.ws='clear';G.wt=0;let bonus=G.wave*200,sm;if(G.esc===0&&G.wave%5){bonus+=1000;sm='PERFECT! NONE ESCAPED  +'+bonus;}else sm='WAVE BONUS +'+bonus;G.score+=bonus;banner('WAVE CLEAR',sm,'#a7f070',140);sfx.clear();}
function updWave(){G.wt++;
 if(G.ws==='intro'){if(G.wt>90){G.ws='fight';G.wt=0;}}
 else if(G.ws==='fight'){const live=G.en.filter(e=>e.type!=='jelly').length;const cap=Math.min(12,3+Math.floor(G.wave/1.5));
  if(G.q.length&&--G.spawnT<=0&&live<cap){const t=G.q.shift();if(t==='drone')spawnDrones();else spawnEnemy(t);G.spawnT=Math.max(35,140-G.wave*7)+rand(0,50);}
  if(!G.q.length&&live===0)waveClear();}
 else if(G.ws==='bossIntro'){if(G.wt>170){G.boss=BOSSES[G.bossIdx].c(1+G.cycle*0.6);G.ws='boss';}}
 else if(G.ws==='boss'){if(!G.boss)waveClear();}
 else if(G.ws==='clear'){if(G.wt>150)startWave(G.wave+1);}}

function spawnEnemy(type,o={}){const T=ETYPES[type];
 if(type==='jelly'){const e={type,T,x:rand(30,W-30),y:H+10,ty:SEA+rand(40,150),vx:rand(-0.25,0.25),hp:1,maxhp:1,ph:rand(0,6),fr:0,flash:0,rev:0,w:9,h:9,dir:1};G.en.push(e);return e;}
 const dir=o.dir||(Math.random()<0.5?1:-1),d=DEPTH[type];const y=o.y!==undefined?o.y:SEA+rand(d[0],d[1]);const x=o.x!==undefined?o.x:(dir>0?-T.spr.w:W+T.spr.w);
 const sc=1+Math.min(1,G.wave*0.03);
 const e={type,T,x,y,y0:y,dir,spd:rand(T.spd[0],T.spd[1])*sc,hp:T.hp,maxhp:T.hp,fireT:T.rate?rand(T.rate[0],T.rate[1])*0.5:0,flash:0,ph:rand(0,6.28),rev:0,w:T.spr.w,h:T.spr.h};
 if(o.x!==undefined)bubbles(x,y,8,6);
 G.en.push(e);return e;}
function spawnDrones(){const dir=Math.random()<0.5?1:-1,y=SEA+rand(50,140);for(let i=0;i<5;i++){const e=spawnEnemy('drone',{dir,y,x:dir>0?-12-i*16:W+12+i*16});e.ph=i*0.7;e.spd=1.15+G.wave*0.01;}}
const eBox=e=>({x:e.x-e.w/2+1,y:e.y-e.h/2+1,w:e.w-2,h:e.h-2});
function shipBox(){const p=G.p,S=G.S;return{x:p.x-S.spr.w/2+2,y:SEA-S.spr.h+S.draft+2,w:S.spr.w-4,h:S.spr.h-S.draft};}
function addText(x,y,s,c='#f4f4f4',life=60){G.texts.push({x,y,s,c,t:0,life});}
function addTorp(x,y,tx){let a=Math.atan2(SEA-y,tx-x);a=clamp(a,-Math.PI+0.45,-0.45);const s=1.25+Math.min(0.8,G.wave*0.03);G.sh.push({k:'torp',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0});sfx.torp();bubbles(x,y,3,2);}
function addMine(x,y,vx,vy=-0.2){G.sh.push({k:'mine',x,y,vx,vy,t:0});}
function mineRing(x,y,n){for(let i=0;i<n;i++){const a=i/n*Math.PI*2;addMine(x+Math.cos(a)*20,y+Math.sin(a)*12,Math.cos(a)*0.9,Math.sin(a)*0.6);}sfx.torp();}
function eFire(e){switch(e.T.fire){
 case 'mine':addMine(e.x,e.y,0);break;
 case 'mines3':for(let k=-1;k<=1;k++)addMine(e.x+k*6,e.y,k*0.4);break;
 case 'torp':addTorp(e.x,e.y-4,G.p.x+rand(-12,12));break;
 case 'missile':G.sh.push({k:'missile',x:e.x,y:e.y-6,vx:0,vy:-1.6,air:false,t:0});sfx.launch();break;}}

function updEnemies(){const stun=G.stun>0;
 for(const e of G.en){if(e.flash>0)e.flash--;if(e.rev>0)e.rev--;
  if(e.type==='jelly'){e.fr++;if(e.fr<1500){if(e.y>e.ty)e.y-=0.3;else{e.x+=e.vx;e.y+=Math.sin(e.fr*0.03+e.ph)*0.25;if(e.x<10||e.x>W-10)e.vx*=-1;}}else{e.y+=0.4;if(e.y>H+12)e.dead=true;}continue;}
  if(!stun){e.x+=e.dir*e.spd;
   e.y=e.type==='drone'?e.y0+Math.sin(G.t*0.06+e.ph)*14:e.y0+Math.sin(G.t*0.025+e.ph)*2.5;
   if(e.T.fire&&e.x>12&&e.x<W-12&&!G.p.dead&&--e.fireT<=0){eFire(e);const r=e.T.rate;e.fireT=rand(r[0],r[1])*Math.max(0.45,1-G.wave*0.025);}}
  if(G.t%20===0&&Math.random()<0.5)bubbles(e.x-e.dir*e.w/2,e.y,1,1);
  if((e.dir>0&&e.x>W+e.w)||(e.dir<0&&e.x<-e.w)){e.dead=true;G.esc++;}}
 G.en=G.en.filter(e=>!e.dead);}
function dmgEnemy(e,d){if(e.type==='jelly'){killEnemy(e);return;}e.hp-=d;e.flash=8;e.rev=90;if(e.hp<=0)killEnemy(e);else sfx.hitTick();}
function killEnemy(e){if(e.dead)return;e.dead=true;G.kills++;
 if(G.comboT>0)G.combo++;else G.combo=1;G.comboT=110;G.best=Math.max(G.best,G.combo);
 const mult=Math.min(8,G.combo),depth=1+((e.y-SEA)/(H-SEA))*0.6;const pts=Math.round(e.T.pts*depth*mult/10)*10;G.score+=pts;
 addText(e.x,e.y-6,'+'+pts+(mult>1?' X'+mult:''),mult>1?'#ffcd75':'#f4f4f4');
 G.p.sp=Math.min(100,G.p.sp+(e.type==='drone'?4:9));
 for(let i=0;i<14;i++)P(e.x+rand(-e.w/2,e.w/2),e.y+rand(-3,3),rand(-1,1),rand(-1.2,0.4),rand(60,120),choice([e.T.col[0],e.T.col[2],'#333c57']),Math.random()<0.5?2:1,'d');
 G.booms.push({x:e.x,y:e.y,r:e.w*0.5+6,t:0,dur:22,uw:true});
 if(e.type!=='jelly'&&e.type!=='drone')G.wrecks.push({s:e.T.spr,x:e.x,y:e.y,left:e.dir<0,rot:0,vr:rand(0.004,0.012)*(Math.random()<0.5?1:-1),vy:0.15,t:0,rest:0});
 if(Math.random()<(e.T.drop||0.12))spawnPick(e.x,e.y);
 if(mult>=3&&lim('combo',250))tone({type:'square',f:440*Math.pow(1.122,mult),t:0.12,v:0.08});}

function spawnPick(x,y,k){if(!k){const ks=Object.keys(PK);let tot=0;const ws=ks.map(q=>{let w=PK[q].w;if(q==='R'&&G.p.hp>=G.S.hp)w=0.3;tot+=w;return w;});let r=Math.random()*tot;k=ks[ks.length-1];for(let i=0;i<ks.length;i++){r-=ws[i];if(r<=0){k=ks[i];break;}}}
 G.picks.push({k,x,y,vx:rand(-0.2,0.2),t:0,surf:false,life:480});}
function updPicks(){const p=G.p,S=G.S;for(const k of G.picks){k.t++;
 if(!k.surf){k.y-=0.55;k.x+=k.vx;if(k.y<=SEA){k.surf=true;splash(k.x,6,0.5);}}else{k.life--;k.y=waveAt(k.x)-2;k.x+=Math.sin(k.t*0.02)*0.15;if(k.life<=0)k.dead=true;}
 k.x=clamp(k.x,6,W-6);
 if(!p.dead&&!k.dead&&Math.abs(k.x-p.x)<S.spr.w/2+3&&k.y<SEA+6)collect(k);}
 G.picks=G.picks.filter(k=>!k.dead);}
function collect(k){k.dead=true;const p=G.p;sfx.pickup();addText(k.x,SEA-18,PK[k.k].n,PK[k.k].c,70);G.score+=50;
 switch(k.k){case 'R':p.hp=Math.min(G.S.hp,p.hp+1);break;case 'S':p.shield=1;break;case 'E':p.sp=100;break;case 'N':nuke();break;default:p.pow[k.k]=900;}
 for(let i=0;i<12;i++)P(k.x,k.y,rand(-1.5,1.5),rand(-2,0),30,PK[k.k].c,1,'c');}
function nuke(){sfx.nuke();flash('#ffffff',1);shake=14;hitstop=6;for(const e of G.en)if(!e.dead&&e.x>-10&&e.x<W+10){G.booms.push({x:e.x,y:e.y,r:20,t:-randi(0,15),dur:20,uw:true});killEnemy(e);}for(const s of G.sh)killShot(s,false);if(G.boss&&!G.boss.dying)G.boss.hit(12);}

function killShot(s,chain){if(s.dead)return;s.dead=true;if(chain&&(s.k==='mine'||s.k==='ink')){G.pend.push({x:s.x,y:s.y,r:14,d:6});G.score+=25;addText(s.x,s.y-6,'+25','#94b0c2',40);}else{G.booms.push({x:s.x,y:s.y,r:6,t:0,dur:14,uw:s.y>SEA});bubbles(s.x,s.y,4,2);}}
function explode(x,y,r,dmg=1){G.booms.push({x,y,r,t:0,dur:20,uw:y>SEA});
 for(let i=0;i<r*0.8;i++){const a=rand(0,6.28),s=rand(0.5,2.5)*r/16;P(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(14,30),null,Math.random()<0.4?2:1,'f');}
 if(y>SEA){bubbles(x,y,Math.floor(r*0.7),r*0.6);for(let i=0;i<3;i++)P(x+rand(-4,4),y+rand(-4,4),rand(-.3,.3),rand(-.3,.1),rand(40,70),'#566c86',4,'s');}
 if(y<SEA+40)splash(x,10,0.8+Math.max(0,SEA+40-y)/40);
 sfx.boom(r/16);shake=Math.max(shake,r/5);
 if(!dmg)return false;
 let hitAny=false;
 for(const e of G.en){if(e.dead)continue;if(circRect(x,y,r,eBox(e))){hitAny=true;dmgEnemy(e,dmg);}}
 for(const s of G.sh){if(!s.dead&&!(s.k==='missile'&&s.air)&&Math.hypot(s.x-x,s.y-y)<r+3)killShot(s,true);}
 if(G.boss&&!G.boss.dying){let m=0;for(const pt of G.boss.getParts())if(circRect(x,y,r,pt))m=Math.max(m,pt.mul);if(m>0){G.boss.hit(dmg*m);hitAny=true;}}
 return hitAny;}
function surfBlast(x,r){explode(x,SEA-2,r,0);if(!G.p.dead&&Math.abs(x-G.p.x)<G.S.spr.w/2+r*0.4)hurtShip();}
function hurtShip(){const p=G.p;if(p.dead||p.inv>0)return;if(G.S.special==='burn'&&p.spT>0)return;
 if(p.shield>0){p.shield=0;p.inv=60;sfx.shield();G.rings.push({x:p.x,y:SEA-6,r:6,max:30,c:'#73eff7',v:1.5});return;}
 p.hp--;p.inv=110;shake=10;flash('#b13e53',0.45);sfx.hurt();G.combo=0;G.comboT=0;
 for(let i=0;i<14;i++)P(p.x+rand(-10,10),SEA-6,rand(-1.5,1.5),rand(-2.5,-0.5),rand(40,80),choice(['#566c86','#94b0c2','#333c57']),2,'d');
 if(p.hp<=0)killShip();}
function killShip(){const p=G.p;p.dead=true;p.sinkY=0;G.overT=0;sfx.big();flash('#ffffff',0.8);shake=16;hitstop=8;for(let i=0;i<5;i++)G.pend.push({x:p.x+rand(-15,15),y:SEA-4+rand(-4,4),r:14,d:i*10+2,vis:true});setMusic(null);saveHi();}

// ---------------- player ----------------
function inFlight(){let n=0;for(const b of G.bombs)if(!b.free)n++;return n;}
function capN(){const S=G.S,p=G.p;return S.bombs+(p.pow.F>0?3:0)+(S.special==='burn'&&p.spT>0?3:0);}
function dropBomb(side){const p=G.p,S=G.S;if(inFlight()>=capN())return false;
 const x=p.x+side*p.face*(S.spr.w/2-5),big=p.pow.M>0,id=G.drops;
 const mk=(vx,free)=>G.bombs.push({x,y:SEA-7,vx,vy:0.4,big,hom:p.pow.H>0?0.05:S.homing?0.018:0,free,t:0,r:S.blast*(big?1.6:1),air:true,dmg:big?1.5:1,id});
 mk(side*p.face*0.4+p.vx*0.3,false);if(p.pow.T>0){mk(-0.9+p.vx*0.3,true);mk(0.9+p.vx*0.3,true);}
 G.drops++;p.cd=14;sfx.drop();return true;}
function special(){const p=G.p,S=G.S;if(p.sp<100||p.dead)return;p.sp=0;
 switch(S.special){
  case 'sonar':G.stun=200;G.reveal=600;sfx.ping();G.rings.push({x:p.x,y:SEA+2,r:4,max:520,c:'#73eff7',v:4});for(const s of G.sh)if(!(s.k==='missile'&&s.air))killShot(s,false);if(G.boss)G.boss.stun=100;flash('#73eff7',0.25);break;
  case 'burn':p.spT=200;sfx.burn();break;
  case 'barrage':G.barrage=9;G.barT=0;sfx.barrage();break;
  case 'salvo':for(let i=0;i<4;i++)G.bombs.push({torp:true,x:p.x+(i-1.5)*8,y:SEA+3,vx:(i-1.5)*0.8,vy:1.2,free:true,t:0,r:20,dmg:2,id:-1});sfx.torp();sfx.launch();break;}
 addText(p.x,SEA-24,S.spName+'!','#ff77a8',70);}
function updPlayer(){const p=G.p,S=G.S;
 if(p.dead){p.sinkY+=0.3;if(G.t%6===0)bubbles(p.x+rand(-10,10),SEA+p.sinkY,2,6);if(G.t%10===0)P(p.x+rand(-12,12),SEA-4,rand(-.2,.2),-0.4,60,'#566c86',4,'s');return;}
 const burn=S.special==='burn'&&p.spT>0;const ax=(held('right')?1:0)-(held('left')?1:0);const mx=S.speed*(burn?2.1:1);
 p.vx+=ax*S.accel*(burn?1.6:1);p.vx*=0.86;p.vx=clamp(p.vx,-mx,mx);p.x+=p.vx;
 const hw=S.spr.w/2;if(p.x<hw){p.x=hw;p.vx=0;}if(p.x>W-hw){p.x=W-hw;p.vx=0;}if(ax)p.face=ax;
 if(Math.abs(p.vx)>0.4&&G.t%3===0)P(p.x-Math.sign(p.vx)*hw,SEA+rand(-1,1),-p.vx*0.3,rand(-0.3,0),rand(20,35),'#ffffff',1,'c');
 if(burn&&G.t%2===0)P(p.x-p.face*hw,SEA-3,-p.face*rand(0.5,1.5),rand(-0.5,0),20,null,2,'f');
 if(p.cd>0)p.cd--;
 const want=k=>hit(k)||(held(k)&&p.cd<=0);
 if(want('stern'))dropBomb(-1);else if(want('bow'))dropBomb(1);else if(want('drop')){if(dropBomb(p.side))p.side*=-1;}
 if(hit('special'))special();
 p.sp=Math.min(100,p.sp+0.025);if(p.inv>0)p.inv--;if(p.spT>0)p.spT--;for(const k in p.pow)if(p.pow[k]>0)p.pow[k]--;}
function nearestTarget(x,y){let best=null,bd=1e9;for(const e of G.en){if(e.dead||e.type==='jelly'||e.y<y-10)continue;const d=Math.abs(e.x-x)+Math.abs(e.y-y)*0.5;if(d<bd){bd=d;best=e;}}

class Boss{
 constructor(name,hp,s){this.name=name;this.hp=this.max=hp;this.s=s;this.flash=0;this.t=0;this.stun=0;this.dying=0;this.dir=-1;this.x=W+s.w/2+10;this.y=160;this.rot=0;}
 get ph(){return this.hp/this.max;}
 getParts(){if(this._pf!==G.t){this._pf=G.t;this._p=this.parts();}return this._p;}
 hit(d){if(this.dying)return;this.hp-=d;this.flash=6;sfx.hitTick();if(this.hp<=0){this.hp=0;this.dying=1;sfx.big();G.beams=[];shake=12;}}
 tick(){this.t++;if(this.flash>0)this.flash--;
  if(this.dying){this.dying++;this.y+=0.25;this.rot+=0.002*this.dir;if(this.dying%7===0){const pt=choice(this.getParts());explode(pt.x+rand(0,pt.w),pt.y+rand(0,pt.h),rand(10,20),0);}if(this.dying>200)this.finish();return false;}
  if(this.stun>0){this.stun--;return false;}return true;}
 finish(){for(let i=0;i<8;i++)G.booms.push({x:this.x+rand(-this.s.w/2,this.s.w/2),y:this.y+rand(-15,15),r:rand(18,34),t:-randi(0,20),dur:24,uw:true});sfx.big();flash('#ffffff',1);shake=20;hitstop=10;
  const bonus=5000*(G.bossIdx+1)*(1+G.cycle);G.score+=bonus;addText(this.x,this.y-30,'BOSS DESTROYED +'+bonus,'#ffcd75',150);
  for(let i=0;i<3;i++)spawnPick(this.x+rand(-30,30),this.y,i===0?'R':null);bubbles(this.x,this.y,60,40);G.boss=null;G.beams=[];}
 wx(ox){return this.dir>0?this.x-this.s.w/2+ox:this.x+this.s.w/2-ox;}
 wy(oy){return this.y-this.s.h/2+oy;}
 drawBody(over){const s=this.s,white=this.flash%2===1;const img=white?(this.dir<0?s.wl:s.wr):(this.dir<0?s.l:s.r);ctx.save();ctx.translate(Math.round(this.x),Math.round(this.y));if(this.rot)ctx.rotate(this.rot);ctx.drawImage(img,-Math.floor(s.w/2),-Math.floor(s.h/2));
  if(over&&!white){if(this.dir<0)ctx.scale(-1,1);ctx.translate(-Math.floor(s.w/2),-Math.floor(s.h/2));over();}ctx.restore();}
 stunFx(){if(this.stun>0&&!this.dying)for(let i=0;i<3;i++)txt('*',this.x+Math.cos(G.t*0.1+i*2.1)*30,this.y-this.s.h/2-6+Math.sin(G.t*0.1+i*2.1)*4,'#ffcd75');}
}

   if(--this.sum<=0){this.sum=520*k;spawnEnemy('stealth',{dir:1});spawnEnemy('stealth',{dir:-1});}
   if(p2&&--this.ring<=0){this.ring=240*k;mineRing(this.x,this.y,10);}}
  else if(this.st==='charge'){this.stT++;this.beamX=this.wx(151);this.x+=clamp(G.p.x-this.beamX,-1.4,1.4);this.beamX=this.wx(151);if(this.stT>70){this.st='fire';this.stT=0;sfx.beam();shake=6;}}
  else if(this.st==='fire'){this.stT++;this.beamX=this.wx(151);if(this.stT%3===0)splash(this.beamX,4,1.5);if(this.stT>2&&!G.p.dead&&Math.abs(G.p.x-this.beamX)<G.S.spr.w/2+4)hurtShip();if(this.stT>40)this.st='move';}}
 draw(){const p3=this.ph<0.25;this.drawBody(()=>{for(let i=0;i<8;i++){ctx.fillStyle=((this.t>>3)+i)%2?(p3?'#ff3040':'#73eff7'):'#29366f';ctx.fillRect(20+i*20,40,2,1);}
   if(this.st==='charge'){ctx.fillStyle=(this.t>>1)%2?'#ff77a8':'#ff3040';ctx.fillRect(149,8,4,3);}if(p3){ctx.fillStyle=(this.t>>2)%2?'#ff3040':'#b13e53';ctx.fillRect(90,11,28,2);}});
  const top=this.wy(8);
  if(this.st==='charge'){if((this.t>>1)%2){ctx.fillStyle='#ff3040';for(let y=top;y>0;y-=4)ctx.fillRect(Math.round(this.beamX),Math.round(y),1,2);}disc(this.beamX,top,2+(this.stT/70)*4,'#ff77a8');}
  if(this.st==='fire'){const w=6+Math.sin(this.t*0.8)*2;ctx.globalAlpha=0.25;ctx.fillStyle='#ff77a8';ctx.fillRect(Math.round(this.beamX-w*2),0,Math.round(w*4),Math.round(top));ctx.globalAlpha=1;ctx.fillStyle='#ff3040';ctx.fillRect(Math.round(this.beamX-w),0,Math.round(w*2),Math.round(top));ctx.fillStyle='#fff4c4';ctx.fillRect(Math.round(this.beamX-2),0,4,Math.round(top));}
  this.stunFx();}
}
const BOSSES=[{n:'THE LEVIATHAN',c:m=>new Leviathan(m)},{n:'KRAKEN',c:m=>new Kraken(m)},{n:'IRON WHALE',c:m=>new IronWhale(m)},{n:'ABYSS DREADNOUGHT',c:m=>new Dread(m)}];

// ---------------- main game update ----------------
function updGame(){G.t++;
 if(G.banner&&++G.banner.t>G.banner.dur)G.banner=null;
 const p=G.p;updPlayer();
 if(p.dead&&++G.overT>200){state='over';G.overT=0;sfx.over();}
 if(G.barrage>0&&--G.barT<=0){G.barT=4;const i=9-G.barrage;G.bombs.push({x:clamp(p.x+(i-4)*15,4,W-4),y:SEA-7,vx:0,vy:0.3,big:true,hom:0,free:true,t:0,r:G.S.blast*1.4,air:true,dmg:1.5,id:-1});G.barrage--;sfx.drop();}
 updWave();updEnemies();if(G.boss)G.boss.update();updBombs();updShots();
 for(const q of G.pend)if(--q.d<=0){q.done=true;explode(q.x,q.y,q.r,q.vis?0:1);}G.pend=G.pend.filter(q=>!q.done);
 for(const b of G.booms)b.t++;G.booms=G.booms.filter(b=>b.t<b.dur);
 updWrecks();updPicks();updBeams();
 for(const r of G.rings)r.r+=r.v;G.rings=G.rings.filter(r=>r.r<r.max);
 for(const t of G.texts){t.t++;t.y-=0.35;}G.texts=G.texts.filter(t=>t.t<t.life);
 if(G.comboT>0&&--G.comboT===0)G.combo=0;if(G.stun>0)G.stun--;if(G.reveal>0)G.reveal--;
 updParts();}

function drawEnemy(e){

 let a=1;if(e.T.stealth&&G.reveal<=0&&e.rev<=0){a=0.1+0.08*Math.sin(G.t*0.2+e.ph);if(G.bombs.some(b=>Math.abs(b.x-e.x)<30&&Math.abs(b.y-e.y)<25))a=0.5;}
 dspr(e.T.spr,e.x,e.y,e.dir<0,e.flash%2===1,a);
 if(a<0.3)return;
 const px=Math.round(e.x-e.dir*(e.w/2+1));ctx.fillStyle='#94b0c2';ctx.fillRect(px,Math.round(e.y)-2+((G.t>>2)%2)*2,1,2);
 if(G.stun>0)txt('*',e.x+Math.cos(G.t*0.2+e.ph)*6,e.y-e.h/2-7,'#ffcd75');
 if(e.maxhp>1&&e.hp<e.maxhp){ctx.fillStyle='#1a1c2c';ctx.fillRect(Math.round(e.x-8),Math.round(e.y-e.h/2-4),16,2);ctx.fillStyle='#a7f070';ctx.fillRect(Math.round(e.x-8),Math.round(e.y-e.h/2-4),Math.round(16*e.hp/e.maxhp),2);}}
function drawShot(s){switch(s.k){
 case 'mine':dimg(SPR.mine,s.x,s.y);if((G.t>>(s.surf?2:3))%2){ctx.fillStyle='#ff3040';ctx.fillRect(Math.round(s.x-4.5)+4,Math.round(s.y-4.5)+4,1,1);}break;
 case 'ink':dimg(SPR.ink,s.x,s.y);break;
 case 'torp':drawRot(SPR.torp,s.x,s.y,Math.atan2(s.vy,s.vx)+Math.PI/2);break;
 case 'missile':drawRot(SPR.missile,s.x,s.y,Math.atan2(s.vy,s.vx));break;}}
function drawBomb(b){if(b.torp){drawRot(SPR.ptorp,b.x,b.y,Math.atan2(b.vy,b.vx)+Math.PI/2);return;}dspr(b.big?SPR.bombBig:SPR.bomb,b.x,b.y,false,false);if(b.hom&&(G.t>>2)%2){ctx.fillStyle='#a7f070';ctx.fillRect(Math.round(b.x),Math.round(b.y)-4,1,1);}}
function drawWrecks(){for(const w of G.wrecks){const a=w.rest>60?Math.max(0,1-(w.rest-60)/80):1,s=w.s;if(!s.dk){s.dk=tintC(s.r,'#1a1c2c');s.dkl=tintC(s.l,'#1a1c2c');}
 ctx.save();ctx.translate(Math.round(w.x),Math.round(w.y));ctx.rotate(w.rot);ctx.globalAlpha=a*0.9;ctx.drawImage(w.left?s.l:s.r,-Math.floor(s.w/2),-Math.floor(s.h/2));ctx.globalAlpha=a*Math.min(0.7,w.t/60);ctx.drawImage(w.left?s.dkl:s.dk,-Math.floor(s.w/2),-Math.floor(s.h/2));ctx.restore();}ctx.globalAlpha=1;}
function drawShip(){const p=G.p,S=G.S,s=S.spr;
 if(p.dead){if(p.sinkY>40)return;ctx.save();ctx.globalAlpha=Math.max(0,1-p.sinkY/40);ctx.translate(Math.round(p.x),Math.round(SEA-s.h/2+S.draft+p.sinkY));ctx.rotate(p.sinkY*0.012*p.face);ctx.drawImage(p.face<0?s.l:s.r,-Math.floor(s.w/2),-Math.floor(s.h/2));ctx.restore();return;}
 const burn=S.special==='burn'&&p.spT>0;if(p.inv>0&&!burn&&(p.inv>>2)%2===0)return;
 const bob=(waveAt(p.x)-SEA)*0.7;dspr(s,p.x,SEA-s.h/2+S.draft+bob,p.face<0,burn&&(frame>>1)%2===1);
 if(p.shield)ring(p.x,SEA-5+bob,s.w/2+3,(frame>>2)%2?'#73eff7':'#41a6f6');}
function drawPicks(){for(const k of G.picks){if(k.surf&&k.life<120&&(k.life>>2)%2)continue;const x=Math.round(k.x)-5,y=Math.round(k.y)-5,c=PK[k.k].c;
 ctx.fillStyle='#1a1c2c';ctx.fillRect(x,y,11,11);ctx.fillStyle=c;ctx.fillRect(x+1,y+1,9,9);ctx.fillStyle='#f4f4f4';ctx.fillRect(x+1,y+1,9,1);drawStrTo(ctx,k.k,x+4,y+3,'#1a1c2c',1);
 ctx.fillStyle='#1a1c2c';ctx.fillRect(x+5,y-4,1,4);ctx.fillStyle=(frame>>3)%2?'#ff3040':'#f4f4f4';ctx.fillRect(x+6,y-4,2,2);}}
function drawBooms(){for(const b of G.booms){if(b.t<0)continue;const p=b.t/b.dur,rr=b.r*(0.35+0.75*Math.min(1,p*3));
 if(p<0.12)disc(b.x,b.y,rr,'#ffffff');else if(p<0.35){disc(b.x,b.y,rr,'#ffcd75');disc(b.x,b.y,rr*0.55,'#fff4c4');}else if(p<0.6){disc(b.x,b.y,rr*(1.2-p),'#ef7d57');disc(b.x,b.y,rr*(0.9-p),'#b13e53');ring(b.x,b.y,rr*1.1,'#ffcd75');}else{ctx.globalAlpha=1-p;ring(b.x,b.y,rr*1.3,b.uw?TH.foam:'#94b0c2');ctx.globalAlpha=1;}}}
function drawBeams(){for(const b of G.beams){if(b.k!=='gey')continue;if(b.t<60){if((b.t>>2)%2){ctx.fillStyle='#ff3040';ctx.fillRect(Math.round(b.x-7),SEA+2,14,1);txt('!',b.x,SEA-16,'#ff3040',2,'c');}}
 else{const h=Math.min(1,(b.t-60)/6)*(b.t>85?(95-b.t)/10:1)*56;ctx.fillStyle=TH.foam;ctx.fillRect(Math.round(b.x-6),Math.round(SEA-h),12,Math.round(h)+2);ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(b.x-2),Math.round(SEA-h),4,Math.round(h));}}}
function drawHUD(){const p=G.p,S=G.S;
 txt('SCORE',4,3,'#94b0c2');txt(String(G.score).padStart(7,'0'),28,3);
 txt('HI '+String(Math.max(hi,G.score)).padStart(7,'0'),W/2,3,'#ffcd75',1,'c');txt('WAVE '+G.wave,W-4,3,'#a7f070',1,'r');

 const my=28,mw=50,ready=p.sp>=100;ctx.fillStyle='#1a1c2c';ctx.fillRect(4,my,mw+2,4);ctx.fillStyle=ready?((frame>>3)%2?'#ff77a8':'#ffcd75'):'#a33a6a';ctx.fillRect(5,my+1,Math.round(mw*p.sp/100),2);
 txt(ready?S.spName+' READY [C]':S.spName,mw+10,my-1,ready?'#ff77a8':'#566c86');
 let y=11;for(const k of ['T','M','F','H']){if(p.pow[k]>0){const col=PK[k].c;if(p.pow[k]>120||(frame>>2)%2){txt(PK[k].n,W-4,y,col,1,'r');ctx.fillStyle=col;ctx.fillRect(W-44,y+6,Math.round(40*p.pow[k]/900),1);}y+=10;}}
 if(G.comboT>0&&G.combo>1){const big=G.combo>=5;txt('CHAIN X'+Math.min(8,G.combo),W/2,12,big?'#ff77a8':'#ffcd75',big?2:1,'c');}
 if(G.boss){const b=G.boss,bw=200,bx=W/2-bw/2,by=H-10;ctx.fillStyle='#1a1c2c';ctx.fillRect(bx-1,by-1,bw+2,6);ctx.fillStyle='#5d275d';ctx.fillRect(bx,by,bw,4);ctx.fillStyle=b.flash?'#ffffff':'#ff3040';ctx.fillRect(bx,by,Math.round(bw*b.hp/b.max),4);txt(b.name,W/2,by-8,'#ff77a8',1,'c');}}
function drawBanner(){const b=G.banner;if(!b)return;const a=b.t<15?b.t/15:b.t>b.dur-20?Math.max(0,(b.dur-b.t)/20):1,y=96;
 if(b.warn){if((b.t>>3)%2===0){ctx.globalAlpha=0.25*a;ctx.fillStyle='#ff3040';ctx.fillRect(0,y-12,W,46);}ctx.globalAlpha=a;ctx.fillStyle='#ff3040';for(let i=-1;i<W/10+1;i++){const ox=i*10+(frame%10);ctx.fillRect(ox,y-16,5,2);ctx.fillRect(W-ox,y+38,5,2);}}
 ctx.globalAlpha=a;const off=(1-a)*30;txt(b.big,W/2+off,y,b.col,4,'c');txt(b.small,W/2-off,y+26,'#f4f4f4',1,'c');ctx.globalAlpha=1;}
function renderGame(){drawWorldBack();drawWrecks();for(const e of G.en)drawEnemy(e);if(G.boss)G.boss.draw();
 for(const s of G.sh)drawShot(s);for(const b of G.bombs)drawBomb(b);
 drawSurface();drawShip();if(!(G.p.dead&&G.p.sinkY>40))drawHullWater(G.p.x,G.S.spr.w);drawBeams();drawPicks();drawParts();drawBooms();
 for(const r of G.rings){ctx.globalAlpha=Math.max(0,1-r.r/r.max);ring(r.x,r.y,r.r,r.c);}ctx.globalAlpha=1;
 for(const t of G.texts){ctx.globalAlpha=t.t>t.life-15?(t.life-t.t)/15:1;txt(t.s,t.x,t.y,t.c,1,'c');}ctx.globalAlpha=1;
 drawRain();drawHUD();drawBanner();}

// ---------------- title / select / overlays ----------------
let DEMO=[],demoT=0;
function updTitle(){if(--demoT<=0){demoT=randi(60,140);const T=ETYPES[choice(['scout','patrol','hunter','layer','stealth','iron'])],dir=Math.random()<0.5?1:-1;DEMO.push({T,x:dir>0?-30:W+30,y:SEA+rand(70,180),dir,spd:rand(0.3,0.8)});}
 for(const d of DEMO){d.x+=d.dir*d.spd;if(Math.random()<0.03)bubbles(d.x-d.dir*d.T.spr.w/2,d.y,1,2);}DEMO=DEMO.filter(d=>d.x>-50&&d.x<W+50);updParts();}
function renderTitle(){drawWorldBack();for(const d of DEMO)dspr(d.T.spr,d.x,d.y,d.dir<0,false,d.T.stealth?0.3:1);
 const S=SHIPS[selShip],sx=W/2+Math.sin(frame*0.006)*170,face=Math.cos(frame*0.006)>=0?1:-1;
 drawSurface();dspr(S.spr,sx,SEA-S.spr.h/2+S.draft+(waveAt(sx)-SEA)*0.7,face<0,false);drawHullWater(sx,S.spr.w);if(frame%3===0)P(sx-face*S.spr.w/2,SEA,-face*0.3,-0.2,30,'#ffffff',1,'c');drawParts();
 const lx=W/2-txtW('SINK SUB',5)/2;txt('SINK SUB',W/2,6,'#ffcd75',5,'c');ctx.save();ctx.beginPath();ctx.rect(0,19,W,20);ctx.clip();drawStrTo(ctx,'SINK SUB',lx,6,'#ef7d57',5);ctx.restore();
 txt('DEEP STRIKE',W/2,35,'#73eff7',2,'c');
 if((frame>>5)%2===0)txt('PRESS ENTER TO DEPLOY',W/2,104,'#ffcd75',2,'c');
 txt('HI SCORE '+String(hi).padStart(7,'0'),W/2,126,'#f4f4f4',1,'c');
 const L=[['ARROWS / A D','MOVE'],['Z / X','DROP FROM STERN / BOW'],['SPACE / DOWN','DROP (ALTERNATES)'],['C / UP / SHIFT','SPECIAL ABILITY'],['P / ESC','PAUSE'],['M','MUTE'],['GAMEPAD','SUPPORTED']];
 ctx.globalAlpha=0.55;ctx.fillStyle='#1a1c2c';ctx.fillRect(W/2-110,142,220,L.length*10+10);ctx.globalAlpha=1;
 L.forEach((l,i)=>{txt(l[0],W/2-100,148+i*10,'#a7f070');txt(l[1],W/2+100,148+i*10,'#94b0c2',1,'r');});
 txt('SINK SUBS. CATCH CRATES. CHAIN KILLS. A BOSS EVERY 5 WAVES.',W/2,H-10,'#566c86',1,'c');}
function renderSelect(){drawWorldBack();drawSurface();ctx.globalAlpha=0.6;ctx.fillStyle='#0a0c18';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
 txt('CHOOSE YOUR VESSEL',W/2,12,'#ffcd75',2,'c');
 const cw=108,gap=8,x0=(W-(cw*4+gap*3))/2,y=36,ch=196;
 SHIPS.forEach((S,i)=>{const x=x0+i*(cw+gap),sel=i===selShip;

  ctx.drawImage(S.spr.r,Math.round(x+cw/2-S.spr.w),y+64-S.spr.h*2+S.draft*2+bob,S.spr.w*2,S.spr.h*2);
  ['SPEED','CHARGES','HULL','BLAST'].forEach((n,j)=>{const yy=y+80+j*11;txt(n,x+6,yy,'#94b0c2');for(let k=0;k<5;k++){ctx.fillStyle=k<S.stats[j]?(sel?'#a7f070':'#38b764'):'#333c57';ctx.fillRect(x+64+k*7,yy,5,5);}});
  txt('SPECIAL',x+6,y+130,'#ff77a8');txt(S.spName,x+6,y+140,'#f4f4f4');S.desc.forEach((d,j)=>txt(d,x+6,y+152+j*9,'#94b0c2'));
  txt('HULL '+S.hp+'  CHG '+S.bombs,x+cw/2,y+182,'#566c86',1,'c');});
 txt('< >  SELECT      ENTER  DEPLOY      ESC  BACK',W/2,H-12,'#94b0c2',1,'c');}
function drawPause(){ctx.globalAlpha=0.6;ctx.fillStyle='#05060f';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;txt('PAUSED',W/2,96,'#ffcd75',4,'c');txt('P / ENTER  RESUME      Q  QUIT TO MENU      M  MUTE',W/2,130,'#94b0c2',1,'c');}

 const acc=G.drops?Math.round(G.hitIds.size/G.drops*100):0;
 [['SCORE',G.score],['WAVE REACHED',G.wave],['SUBS SUNK',G.kills],['BEST CHAIN','X'+G.best],['ACCURACY',acc+'%'],['VESSEL',G.S.name]].forEach((l,i)=>{txt(l[0],W/2-80,92+i*12,'#94b0c2');txt(l[1],W/2+80,92+i*12,'#f4f4f4',1,'r');});
 if(G.newHi&&(frame>>4)%2)txt('NEW HIGH SCORE!',W/2,176,'#ffcd75',2,'c');
 if(G.overT>40)txt('ENTER  RETRY      ESC  MENU',W/2,212,'#a7f070',1,'c');}

// ---------------- loop ----------------
function update(){frame++;pollPad();if(pressed.KeyM)setMute(!muted);updAmb();
 switch(state){
  case 'title':updTitle();if(hit('ok')){state='select';sfx.sel();}break;
  case 'select':updParts();if(hit('left')){selShip=(selShip+3)%4;sfx.move();}if(hit('right')){selShip=(selShip+1)%4;sfx.move();}
   if(hit('ok')){localStorage.setItem('sinksub_ship',selShip);sfx.sel();newGame();state='play';}else if(pressed.Escape||pressed.Backspace||pressed.padB)state='title';break;
  case 'play':if(hit('pause')&&!G.p.dead){state='pause';sfx.move();break;}if(hitstop>0){hitstop--;break;}updGame();break;
  case 'pause':if(hit('pause')||pressed.Enter)state='play';else if(pressed.KeyQ){saveHi();state='title';setMusic('title');setTheme(0);}break;
  case 'over':G.overT++;updParts();if(G.overT>40){if(pressed.Enter||pressed.Space||pressed.padA){newGame();state='play';}else if(pressed.Escape||pressed.padB){state='title';setMusic('title');setTheme(0);}}break;}
 if(shake>0){shake*=0.85;if(shake<0.3)shake=0;}if(flashA>0)flashA=Math.max(0,flashA-0.05);
 for(const k in pressed)delete pressed[k];}
function render(){ctx.fillStyle='#05060f';ctx.fillRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(Math.round(rand(-shake,shake)),Math.round(rand(-shake,shake)));
 if(state==='title')renderTitle();else if(state==='select')renderSelect();else renderGame();ctx.restore();
 if(state==='pause')drawPause();if(state==='over')drawOver();
 if(flashA>0){ctx.globalAlpha=Math.min(1,flashA);ctx.fillStyle=flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
 if(muted)txt('MUTED',W-4,H-8,'#566c86',1,'r');}
setTheme(0);
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){acc-=STEP;update();}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
// test hook (harmless in normal play)
window.__ss={get G(){return G;},get state(){return state;},set state(v){state=v;},newGame,startWave,setSel:i=>{selShip=i;},update,render};
